<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- External Portable HDD Body -->
  <rect x="8" y="10" width="22" height="30" rx="4" fill="#2E7D32" fill-opacity="0.12" stroke="#2E7D32" stroke-width="2.5"/>
  <!-- HDD Indicator Light -->
  <circle cx="19" cy="15" r="1.5" fill="#43A047"/>
  <!-- USB Drive Beside It -->
  <rect x="33" y="18" width="8" height="18" rx="2" fill="#2E7D32" stroke="#2E7D32" stroke-width="2"/>
  <!-- USB Metal Connector Pin Tip -->
  <rect x="34" y="12" width="6" height="6" fill="#FFFFFF" stroke="#43A047" stroke-width="1.5"/>
  <line x1="36" y1="14" x2="36" y2="16" stroke="#2E7D32" stroke-width="1"/>
  <line x1="38" y1="14" x2="38" y2="16" stroke="#2E7D32" stroke-width="1"/>
</svg>
